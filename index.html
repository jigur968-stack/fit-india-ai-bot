<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit India AI - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #f4f4f4); color: var(--tg-theme-text-color, #000); }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #2481cc; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Create Profile 🏋️‍♂️</h2>
    <form id="profileForm">
        <div class="form-group"><label>Name</label><input type="text" id="name" placeholder="Name" required></div>
        <div class="form-group"><label>Age</label><input type="number" id="age" placeholder="Age" required></div>
        <div class="form-group">
            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group"><label>Height (cm)</label><input type="number" id="height" placeholder="e.g. 170" required></div>
        <div class="form-group"><label>Weight (kg)</label><input type="number" id="weight" placeholder="e.g. 70" required></div>
        <div class="form-group">
            <label>Goal</label>
            <select id="goal" required>
                <option value="">Select...</option>
                <option value="Weight Loss">Weight Loss</option>
                <option value="Muscle Gain">Muscle Gain</option>
                <option value="Stay Fit">Stay Fit</option>
            </select>
        </div>
        <div class="form-group">
            <label>Medical Condition (Thyroid, BP, Diabetes, etc.)</label>
            <select id="medical" required>
                <option value="">Select...</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>
        <button type="button" onclick="saveData()">Save Data 🚀</button>
    </form>

    <script>
        // पेज लोड होने पर ही टेलीग्राम रेडी होगा (कोई एरर नहीं आएगी)
        window.onload = function() {
            if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.ready();
            }
        };

        function saveData() {
            try {
                // चेक करें कि क्या टेलीग्राम सही से लोड हुआ है
                if (typeof window.Telegram === 'undefined') {
                    alert("लोडिंग हो रही है... कृपया 2 सेकंड रुककर दोबारा 'Save Data' दबाएं।");
                    return;
                }

                let tg = window.Telegram.WebApp;

                let name = document.getElementById('name').value;
                let age = document.getElementById('age').value;
                let gender = document.getElementById('gender').value;
                let height = document.getElementById('height').value;
                let weight = document.getElementById('weight').value;
                let goal = document.getElementById('goal').value;
                let medical = document.getElementById('medical').value;

                if (!name || !age || !height || !weight || !gender || !goal || !medical) {
                    alert("कृपया सभी जानकारी भरें!");
                    return;
                }

                let data = {
                    name: name,
                    age: age,
                    gender: gender,
                    height: height,
                    weight: weight,
                    goal: goal,
                    medical: medical
                };

                // डेटा बॉट को सेंड करें
                tg.sendData(JSON.stringify(data));
                
                // तुरंत बंद होने से पहले थोड़ा (milliseconds) इंतज़ार करें ताकि डेटा पक्का चला जाए
                setTimeout(function() {
                    tg.close();
                }, 150);

            } catch (err) {
                alert("Final Error: " + err.message);
            }
        }
    </script>
</body>
</html>
