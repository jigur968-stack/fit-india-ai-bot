<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit India AI - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #f4f4f4); color: var(--tg-theme-text-color, #000); }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #2481cc; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Create Profile 🏋️‍♂️</h2>
    <form id="profileForm">
        <div class="form-group"><label>Name</label><input type="text" id="name" placeholder="अपना नाम लिखें" required></div>
        <div class="form-group"><label>Age</label><input type="number" id="age" placeholder="अपनी उम्र लिखें" required></div>
        
        <div class="form-group">
            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select...</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="form-group"><label>Height (cm)</label><input type="number" id="height" placeholder="जैसे 170" required></div>
        <div class="form-group"><label>Weight (kg)</label><input type="number" id="weight" placeholder="जैसे 70" required></div>
        
        <div class="form-group">
            <label>Goal</label>
            <select id="goal" required>
                <option value="">Select...</option>
                <option value="Weight Loss">Weight Loss</option>
                <option value="Muscle Gain">Muscle Gain</option>
                <option value="Stay Fit">Stay Fit</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Medical Condition (Thyroid, BP, Diabetes?)</label>
            <select id="medical" required>
                <option value="">Select...</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>
        
        <button type="button" onclick="sendDataToBot()">Save Data 🚀</button>
    </form>

    <script>
        // टेलीग्राम वेब ऐप को इनिशियलाइज़ करना
        let tg = window.Telegram.WebApp;
        tg.expand(); // फॉर्म को पूरी स्क्रीन पर खोलने के लिए

        function sendDataToBot() {
            let data = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                goal: document.getElementById('goal').value,
                medical: document.getElementById('medical').value
            };

            // चेक करना कि कोई फील्ड खाली तो नहीं छूट गई
            if (!data.name || !data.age || !data.gender || !data.height || !data.weight || !data.goal || !data.medical) {
                alert("कृपया सभी जानकारी भरें!");
                return;
            }

            // डेटा बॉट को भेजना
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
