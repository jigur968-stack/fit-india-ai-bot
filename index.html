<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit India AI - User Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: var(--tg-theme-bg-color, #f4f4f9); 
            color: var(--tg-theme-text-color, #000000); 
        }
        h2 { text-align: center; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--tg-theme-button-color, #28a745); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2>अपनी फिटनेस प्रोफाइल बनाएं</h2>
    <form id="userForm">
        <input type="text" id="name" placeholder="आपका नाम" required>
        <input type="number" id="age" placeholder="आपकी उम्र" required>
        
        <select id="gender" required>
            <option value="">जेंडर चुनें</option>
            <option value="Male">पुरुष</option>
            <option value="Female">महिला</option>
        </select>
        
        <input type="number" id="height" placeholder="हाइट (cm में)" required>
        <input type="number" id="weight" placeholder="वजन (kg में)" required>
        
        <select id="goal" required>
            <option value="">आपका फिटनेस लक्ष्य क्या है?</option>
            <option value="Weight Loss">वजन कम करना (Weight Loss)</option>
            <option value="Muscle Gain">मसल बनाना (Muscle Gain)</option>
            <option value="Stay Fit">फिट रहना (Stay Fit)</option>
        </select>
        
        <button type="button" onclick="submitData()">सबमिट करें</button>
    </form>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // ऐप को फुल स्क्रीन में खोलने के लिए

        function submitData() {
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let gender = document.getElementById("gender").value;
            let height = document.getElementById("height").value;
            let weight = document.getElementById("weight").value;
            let goal = document.getElementById("goal").value;

            if(!name || !age || !gender || !height || !weight || !goal) {
                tg.showAlert("कृपया सभी जानकारी सही-सही भरें!");
                return;
            }

            let data = { 
                name: name, 
                age: age, 
                gender: gender, 
                height: height, 
                weight: weight, 
                goal: goal 
            };
            
            // यह डेटा वापस पाइथन बॉट को भेज देगा
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
