<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit India AI - Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color, #f4f4f4); color: var(--tg-theme-text-color, #000); }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: #2481cc; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>अपनी प्रोफाइल बनाएं 🏋️‍♂️</h2>
    
    <form id="profileForm">
        <div class="form-group"><label>आपका नाम</label><input type="text" id="name" required></div>
        <div class="form-group"><label>उम्र</label><input type="number" id="age" required></div>
        <div class="form-group">
            <label>जेंडर</label>
            <select id="gender" required>
                <option value="">चुनें...</option><option value="Male">Male</option><option value="Female">Female</option>
            </select>
        </div>
        <div class="form-group"><label>हाइट (cm में)</label><input type="number" id="height" placeholder="उदा. 170" required></div>
        <div class="form-group"><label>वजन (kg में)</label><input type="number" id="weight" placeholder="उदा. 70" required></div>
        <div class="form-group">
            <label>आपका गोल क्या है?</label>
            <select id="goal" required>
                <option value="">चुनें...</option><option value="Weight Loss">Weight Loss</option><option value="Muscle Gain">Muscle Gain</option><option value="Stay Fit">Stay Fit</option>
            </select>
        </div>
        <!-- Phase 1: Medical Safeguard -->
        <div class="form-group">
            <label>क्या आपको कोई मेडिकल समस्या (Thyroid, Diabetes, BP आदि) है?</label>
            <select id="medical" required>
                <option value="">चुनें...</option>
                <option value="Yes">हाँ (Yes)</option>
                <option value="No">नहीं (No)</option>
            </select>
        </div>
        
        <button type="submit">डेटा सेव करें 🚀</button>
    </form>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        document.getElementById("profileForm").addEventListener("submit", function(e) {
            e.preventDefault(); 
            let data = {
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                gender: document.getElementById("gender").value,
                height: document.getElementById("height").value,
                weight: document.getElementById("weight").value,
                goal: document.getElementById("goal").value,
                medical: document.getElementById("medical").value // मेडिकल डेटा
            };
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
